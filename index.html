<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pri-Max Hogar | Electro, Celulares, Muebles</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Urbanist:wght@400;600;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="header">
  <nav class="nav">
    <a href="index.html" class="logo">PRI-MAX<span>HOGAR</span></a>
    <div class="nav-links">
      <a href="#productos">Productos</a>
      <a href="#" onclick="abrirCarrito(); return false;">🛒 Carrito (<span id="cart-count">0</span>)</a>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>TODO PARA TU HOGAR.<br>EN UN SOLO LUGAR.</h1>
    <p>Electrodomésticos, celulares, muebles y hogar. Envíos a todo el país.</p>
    <a href="#productos" class="btn-primary">VER CATÁLOGO</a>
  </div>
  <div class="hero-img"></div>
</section>

<section class="filtros" id="productos">
  <button class="filtro active" data-cat="todos" onclick="filtrar('todos')">🔥 Todos</button>
  <button class="filtro" data-cat="celulares" onclick="filtrar('celulares')">📱 Celulares</button>
  <button class="filtro" data-cat="electro" onclick="filtrar('electro')">⚡ Electro</button>
  <button class="filtro" data-cat="muebles" onclick="filtrar('muebles')">🛋️ Muebles</button>
  <button class="filtro" data-cat="hogar" onclick="filtrar('hogar')">🏠 Hogar</button>
</section>

<main class="container" id="grid-productos"></main>

<div id="carrito" class="carrito">
  <div class="carrito-header"><h3>TU PEDIDO</h3><span onclick="cerrarCarrito()" style="cursor:pointer; font-size:24px; font-weight:800">✕</span></div>
  <div id="carrito-items"></div>
  <div class="carrito-datos">
    <h4>📋 DATOS DE ENTREGA</h4>
    <input id="cli-nombre" placeholder="Tu nombre y apellido">
    <input id="cli-direccion" placeholder="Dirección + Localidad + Provincia">
    <input id="cli-telefono" placeholder="Tel. de contacto">
    <select id="cli-pago">
      <option value="">Forma de pago</option>
      <option>Transferencia / Efectivo</option>
      <option>Mercado Pago / Tarjeta</option>
      <option>12 cuotas sin interés</option>
      <option>Otro - Consultar</option>
    </select>
    <textarea id="cli-nota" placeholder="Nota: color, horario, etc."></textarea>
  </div>
  <div class="carrito-footer">
    <div class="total">Total: $<span id="carrito-total">0</span></div>
    <a id="btn-finalizar-wsp" class="btn-primary" target="_blank">FINALIZAR POR WHATSAPP</a>
  </div>
</div>

<div id="overlay" onclick="cerrarCarrito()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:99"></div>

<footer class="footer">
  <p>PRI-MAX HOGAR © 2026</p>
  <a href="admin.html" class="admin-dot" title="Admin">⚙</a>
</footer>

<script src="js/app.js"></script>
</body>
</html>
