<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRI-MAX HOGAR</title>
<style>
:root{--p:#e60045;--s:#ffe600;--d:#111}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f6f6f6}
header{background:var(--s);padding:12px 3%;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:9}
.logo{font-weight:900;font-size:22px} .logo span{color:var(--p)}
.search{flex:1;display:flex;background:#fff;border-radius:8px;overflow:hidden}
.search input{flex:1;border:0;padding:12px;outline:0}
.cart{font-size:28px;position:relative;cursor:pointer} .cart b{position:absolute;top:-6px;right:-8px;background:var(--p);color:#fff;border-radius:50%;width:20px;height:20px;font-size:12px;display:grid;place-items:center}
.hero{background:linear-gradient(90deg,var(--p),#7c2bd6);color:#fff;padding:28px 4%;text-align:center}
.hero h1{font-size:28px} .hero p{opacity:.9;margin-top:6px}
.filters{display:flex;gap:8px;padding:12px 3%;overflow:auto}
.filters button{border:1px solid #ddd;background:#fff;padding:8px 14px;border-radius:20px;white-space:nowrap;cursor:pointer}
.filters button.active{background:var(--d);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:0 3% 80px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px #0001;display:flex;flex-direction:column}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.info{padding:10px;flex:1;display:flex;flex-direction:column}
.price{font-weight:900;font-size:18px;color:var(--d)} .old{font-size:12px;text-decoration:line-through;color:#999}
.desc{font-size:12px;color:#666;margin:4px 0;flex:1}
.badge{font-size:10px;background:#e8f5e9;color:#2e7d32;padding:2px 6px;border-radius:4px;width:fit-content}
.btn{width:100%;background:var(--p);color:#fff;border:0;padding:11px;border-radius:8px;font-weight:800;cursor:pointer;margin-top:8px}
#adminBtn{position:fixed;bottom:16px;right:16px;background:var(--d);color:#fff;padding:12px 18px;border-radius:30px;cursor:pointer;z-index:30;box-shadow:0 4px 12px #0003}
/* ADMIN */
#adminPanel{position:fixed;inset:0;background:#0008;z-index:40;display:none;overflow:auto}
.adminBox{max-width:900px;margin:20px auto;background:#fff;border-radius:16px;overflow:hidden}
.tabs{display:flex;background:#f1f1f1} .tabs button{flex:1;padding:14px;border:0;cursor:pointer;font-weight:700}
.tabs button.on{background:#fff;border-bottom:3px solid var(--p)}
.tab{padding:16px;display:none} .tab.on{display:block}
.field{margin-bottom:12px} .field label{font-size:12px;font-weight:700;display:block;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.imgPreview{width:100%;height:200px;object-fit:cover;border-radius:10px;background:#eee;border:2px dashed #ccc;display:block}
.prodList{display:grid;gap:8px} .prodItem{display:flex;gap:10px;background:#fafafa;padding:8px;border-radius:8px;align-items:center}
.prodItem img{width:56px;height:56px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>
<header><div class="logo" id="logoView">PRI-MAX <span>HOGAR</span></div><div class="search"><input id="q" placeholder="Buscar..." oninput="render()"></div><div class="cart" onclick="openCart()">🛒<b id="cb">0</b></div></header>
<div class="hero" id="heroView"><h1 id="hTitle">Todo para tu casa en cuotas</h1><p id="hSub">Muebles • Celulares • Electro • Machagai - Pampa del Infierno • WhatsApp 3734-525075</p></div>
<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<div id="adminBtn" onclick="openAdmin()">⚙️ ADMIN</div>

<!-- CART -->
<div id="cartDrawer" style="position:fixed;right:-420px;top:0;width:380px;max-width:92%;height:100%;background:#fff;z-index:50;transition:.3s;display:flex;flex-direction:column">
<div style="padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #eee"><b>Tu pedido</b><button onclick="cartDrawer.style.right='-420px'">✕</button></div>
<div id="ci" style="flex:1;overflow:auto;padding:12px"></div>
<div style="padding:12px;border-top:1px solid #eee">
<input id="cn" placeholder="Tu nombre y apellido" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px">
<input id="cdir" placeholder="Dirección para envío" style="width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;margin-bottom:8px">
<div style="display:flex;justify-content:space-between;margin:8px 0"><span>Total productos:</span><b id="ct">$0</b></div>
<button class="btn" onclick="checkout()">Pedir por WhatsApp</button>
</div></div>

<!-- ADMIN PANEL -->
<div id="adminPanel"><div class="adminBox">
<div style="padding:14px;display:flex;justify-content:space-between;background:#111;color:#fff"><b>Panel PRI-MAX HOGAR</b><button onclick="adminPanel.style.display='none'" style="background:#fff;border:0;padding:6px 12px;border-radius:6px">Cerrar ✕</button></div>
<div class="tabs">
<button id="t1" class="on" onclick="switchTab(1)">📦 Productos</button>
<button id="t2" onclick="switchTab(2)">🎨 Diseño</button>
<button id="t3" onclick="switchTab(3)">⚙️ Config</button>
</div>

<!-- TAB 1 PRODUCTOS -->
<div id="tab1" class="tab on">
<h3 style="margin-bottom:10px">Agregar / Editar Producto</h3>
<input type="hidden" id="editId">
<div class="field"><label>Foto del producto (desde celular)</label><input type="file" id="fImg" accept="image/*" onchange="previewFile()"><img id="imgPrev" class="imgPreview" src="https://via.placeholder.com/400x300?text=Subi+una+foto"></div>
<div class="row">
<div class="field"><label>Título *</label><input id="fTitle" placeholder="Ej: Placard 6 puertas"></div>
<div class="field"><label>Precio *</label><input id="fPrice" type="number" placeholder="185000"></div>
</div>
<div class="row">
<div class="field"><label>Precio tachado (opcional)</label><input id="fOld" type="number" placeholder="220000"></div>
<div class="field"><label>Stock</label><input id="fStock" type="number" value="10"></div>
</div>
<div class="row">
<div class="field"><label>Categoría</label><select id="fCat"><option>Muebles</option><option>Celulares</option><option>Electro</option><option>Hogar</option><option>Accesorios</option></select></div>
<div class="field"><label>Costo Envío</label><input id="fShip" type="number" value="0" placeholder="0 = gratis"></div>
</div>
<div class="field"><label>Descripción completa</label><textarea id="fDesc" rows="3" placeholder="Medidas, material, colores disponibles, garantía..."></textarea></div>
<button class="btn" onclick="saveProduct()" style="background:#111">💾 Guardar Producto</button>
<button onclick="clearForm()" style="width:100%;margin-top:8px;padding:10px;border:1px solid #ddd;background:#fff;border-radius:8px">Limpiar formulario</button>
<hr style="margin:16px 0">
<h3>Mis productos (<span id="pcount">0</span>)</h3>
<div class="prodList" id="adminList"></div>
</div>

<!-- TAB 2 DISEÑO -->
<div id="tab2" class="tab">
<div class="row">
<div class="field"><label>Color principal (botones)</label><input id="c1" type="color" value="#e60045"></div>
<div class="field"><label>Color secundario (header)</label><input id="c2" type="color" value="#ffe600"></div>
</div>
<div class="field"><label>Título grande (banner)</label><input id="fH1"></div>
<div class="field"><label>Subtítulo banner</label><input id="fH2"></div>
<button class="btn" onclick="saveDesign()" style="background:#111">Aplicar cambios</button>
</div>

<!-- TAB 3 CONFIG -->
<div id="tab3" class="tab">
<div class="field"><label>Nombre tienda</label><input id="sName" value="PRI-MAX HOGAR"></div>
<div class="field"><label>WhatsApp (con 549)</label><input id="sWa" value="5493734525075"></div>
<div class="field"><label>Mensaje bienvenida WhatsApp</label><textarea id="sMsg" rows="2">Hola PRI-MAX HOGAR! Quiero comprar:</textarea></div>
<div style="display:grid;gap:8px;margin-top:14px">
<button onclick="exportData()" style="padding:12px;border:1px solid #ddd;border-radius:8px;background:#fff">📤 Exportar copia de seguridad</button>
<button onclick="if(confirm('¿Borrar TODO?')){localStorage.clear();location.reload()}" style="padding:12px;border:0;border-radius:8px;background:#ffdddd;color:#900">🗑️ Borrar toda la tienda</button>
</div>
</div>

</div></div>

<script>
// DATA
let cfg = JSON.parse(localStorage.getItem('pm_cfg'))||{name:"PRI-MAX HOGAR",wa:"5493734525075",h1:"Todo para tu casa en cuotas",h2:"Muebles • Celulares • Electro • Machagai - Pampa del Infierno • WhatsApp 3734-525075",c1:"#e60045",c2:"#ffe600",msg:"Hola PRI-MAX HOGAR! Quiero comprar:"};
let products = JSON.parse(localStorage.getItem('pm_products'))||[
{id:1,t:"Placard 6 Puertas Reforzado",pr:185000,old:220000,img:"https://images.unsplash.com/photo-1595428774223-ef52624120d2?w=600",c:"Muebles",desc:"Medida 180x180x50, MDF reforzado, 6 puertas, envío gratis Machagai.",stock:5,ship:0},
{id:2,t:"Samsung A15 128GB",pr:245000,img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=600",c:"Celulares",desc:"Nuevo en caja sellada, 1 año garantía.",stock:10,ship:0}
];
let cart=[]; let tempImg="";

function applyCfg(){
document.documentElement.style.setProperty('--p',cfg.c1); document.documentElement.style.setProperty('--s',cfg.c2);
document.getElementById('logoView').innerHTML=cfg.name.split(' ')[0]+" <span>"+(cfg.name.split(' ').slice(1).join(' ')||"HOGAR")+"</span>";
document.getElementById('hTitle').innerText=cfg.h1; document.getElementById('hSub').innerText=cfg.h2;
document.getElementById('sName').value=cfg.name; document.getElementById('sWa').value=cfg.wa;
document.getElementById('fH1').value=cfg.h1; document.getElementById('fH2').value=cfg.h2;
document.getElementById('c1').value=cfg.c1; document.getElementById('c2').value=cfg.c2; document.getElementById('sMsg').value=cfg.msg;
}
function render(){
let q=document.getElementById('q').value.toLowerCase();
let cats=["Todos",...new Set(products.map(p=>p.c))];
document.getElementById('filters').innerHTML=cats.map(c=>`<button class="${(window.activeCat||'Todos')==c?'active':''}" onclick="activeCat='${c}';render()">${c}</button>`).join('');
let list=products.filter(p=>{let m=(p.t+' '+p.desc).toLowerCase().includes(q); let cat=activeCat?activeCat=='Todos'||p.c==activeCat:true; return m&&cat});
document.getElementById('grid').innerHTML=list.map(p=>`
<div class="card">
<img src="${p.img}">
<div class="info">
<div style="display:flex;gap:6px"><span class="badge">${p.c}</span>${p.ship==0?'<span class="badge" style="background:#e3f2fd;color:#1565c0">Envío gratis</span>':''}</div>
<div class="price">$${p.pr.toLocaleString()} ${p.old?`<span class="old">$${p.old.toLocaleString()}</span>`:''}</div>
<div style="font-weight:700;font-size:13px">${p.t}</div>
<div class="desc">${(p.desc||'').slice(0,70)}...</div>
<div style="font-size:11px;color:#888">Stock: ${p.stock} • Envío: ${p.ship==0?'Gratis':'$'+p.ship}</div>
<button class="btn" onclick="addCart(${p.id})">Agregar al carrito</button>
</div></div>`).join('');
document.getElementById('pcount').innerText=products.length;
document.getElementById('adminList').innerHTML=products.map(p=>`<div class="prodItem"><img src="${p.img}"><div style="flex:1"><b style="font-size:13px">${p.t}</b><br><small>$${p.pr} - ${p.c}</small></div><button onclick="editProd(${p.id})" style="padding:6px 10px">✏️</button><button onclick="delProd(${p.id})" style="padding:6px 10px;background:#ffdddd;border:0;border-radius:6px">🗑️</button></div>`).join('');
}
function previewFile(){
let f=document.getElementById('fImg').files[0]; if(!f)return;
let r=new FileReader(); r.onload=e=>{tempImg=e.target.result; document.getElementById('imgPrev').src=tempImg}; r.readAsDataURL(f);
}
function saveProduct(){
let id=document.getElementById('editId').value;
let obj={id:id?+id:Date.now(), t:document.getElementById('fTitle').value, pr:+document.getElementById('fPrice').value, old:+document.getElementById('fOld').value||0, stock:+document.getElementById('fStock').value||0, c:document.getElementById('fCat').value, ship:+document.getElementById('fShip').value||0, desc:document.getElementById('fDesc').value, img:tempImg||document.getElementById('imgPrev').src};
if(!obj.t||!obj.pr||obj.img.includes('placeholder')){alert('Completá título, precio y foto');return}
if(id){products=products.map(p=>p.id==obj.id?obj:p)}else{products.unshift(obj)}
localStorage.setItem('pm_products',JSON.stringify(products)); clearForm(); render(); alert('¡Producto guardado!');
}
function editProd(id){let p=products.find(x=>x.id==id); document.getElementById('editId').value=p.id; document.getElementById('fTitle').value=p.t; document.getElementById('fPrice').value=p.pr; document.getElementById('fOld').value=p.old; document.getElementById('fStock').value=p.stock; document.getElementById('fCat').value=p.c; document.getElementById('fShip').value=p.ship; document.getElementById('fDesc').value=p.desc; tempImg=p.img; document.getElementById('imgPrev').src=p.img; switchTab(1); window.scrollTo(0,0)}
function delProd(id){if(confirm('¿Borrar?')){products=products.filter(p=>p.id!=id);localStorage.setItem('pm_products',JSON.stringify(products));render()}}
function clearForm(){['editId','fTitle','fPrice','fOld','fStock','fShip','fDesc'].forEach(i=>document.getElementById(i).value=''); document.getElementById('fStock').value=10; document.getElementById('imgPrev').src='https://via.placeholder.com/400x300?text=Subi+una+foto'; tempImg='';}
function saveDesign(){cfg.h1=document.getElementById('fH1').value; cfg.h2=document.getElementById('fH2').value; cfg.c1=document.getElementById('c1').value; cfg.c2=document.getElementById('c2').value; cfg.name=document.getElementById('sName').value; cfg.wa=document.getElementById('sWa').value; cfg.msg=document.getElementById('sMsg').value; localStorage.setItem('pm_cfg',JSON.stringify(cfg)); applyCfg(); alert('¡Diseño actualizado!')}
function switchTab(n){[1,2,3].forEach(i=>{document.getElementById('tab'+i).classList.toggle('on',i==n); document.getElementById('t'+i).classList.toggle('on',i==n)})}
function openAdmin(){let k=prompt('Clave admin:'); if(k!=='admin123'&&k!==null){alert('Clave incorrecta (es admin123)');return} document.getElementById('adminPanel').style.display='block'}
function openCart(){document.getElementById('cartDrawer').style.right='0'; updCart()}
function addCart(id){let p=products.find(x=>x.id==id); let f=cart.find(x=>x.id==id); if(f)f.qty++; else cart.push({...p,qty:1}); document.getElementById('cb').innerText=cart.reduce((s,i)=>s+i.qty,0); openCart()}
function updCart(){document.getElementById('ci').innerHTML=cart.map(i=>`<div style="display:flex;gap:8px;margin-bottom:10px"><img src="${i.img}" style="width:56px;height:56px;object-fit:cover;border-radius:8px"><div style="flex:1"><div style="font-size:13px;font-weight:700">${i.t}</div><small>${i.desc?i.desc.slice(0,40):''}</small><div><b>$${i.pr} x ${i.qty}</b> = $${i.pr*i.qty}</div></div><button onclick="cart=cart.filter(x=>x.id!=${i.id});updCart()" style="height:30px">✕</button></div>`).join(''); document.getElementById('ct').innerText='$'+cart.reduce((s,i)=>s+i.pr*i.qty,0).toLocaleString()}
function checkout(){if(!cart.length){alert('Carrito vacío');return} let name=document.getElementById('cn').value||'Cliente'; let dir=document.getElementById('cdir').value||''; let total=cart.reduce((s,i)=>s+i.pr*i.qty+i.ship,0); let det=cart.map(i=>`- ${i.t} x${i.qty} $${i.pr*i.qty} (Envío $${i.ship})`).join('%0A'); let msg=`${cfg.msg}%0A%0A👤 ${name}%0A📍 ${dir}%0A%0A${det}%0A%0A💰 TOTAL: $${total}%0A`; window.open(`https://wa.me/${cfg.wa}?text=${msg}`)}
function exportData(){let data={cfg,products}; let blob=new Blob([JSON.stringify(data)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='primax-backup.json'; a.click()}
let activeCat='Todos'; applyCfg(); render();
</script>
</body>
</html>
