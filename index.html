<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pri-Max Hogar | Electro, Celulares, Muebles</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Urbanist:wght@400;600;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>
<header class="header">
  <nav class="nav">
    <a href="index.html" class="logo" style="text-decoration:none; color:#111">PRI-MAX<span>HOGAR</span></a>
    <div class="nav-links">
      <a href="#productos">Productos</a>
      <a href="#" onclick="abrirCarrito()">🛒 Carrito (<span id="cart-count">0</span>)</a>
    </div>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>Todo para tu hogar.<br>En un solo lugar.</h1>
    <p>Electrodomésticos, celulares, muebles y hogar. Envíos a todo el país.</p>
    <a href="#productos" class="btn-primary">Ver catálogo</a>
  </div>
  <div class="hero-img"></div>
</section>

<section class="filtros" id="productos">
  <button class="filtro active" data-cat="todos" onclick="filtrar('todos')">🔥 Todos</button>
  <button class="filtro" data-cat="celulares" onclick="filtrar('celulares')">📱 Celulares</button>
  <button class="filtro" data-cat="electro" onclick="filtrar('electro')">⚡ Electro</button>
  <button class="filtro" data-cat="muebles" onclick="filtrar('muebles')">🛋️ Muebles</button>
  <button class="filtro" data-cat="hogar" onclick="filtrar('hogar')">🏠 Hogar</button>
</section>

<main class="container" id="grid-productos"></main>

<div id="carrito" class="carrito">
  <div class="carrito-header"><h3>Tu pedido</h3><span onclick="cerrarCarrito()" style="cursor:pointer; font-size:22px">✕</span></div>
  <div id="carrito-items"></div>
  <div class="carrito-datos" style="padding:15px; border-top:1px solid #eee; background:#fff">
    <h4 style="margin:0 0 10px; font-size:14px">📋 Datos de entrega</h4>
    <input id="cli-nombre" placeholder="Tu nombre y apellido" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px">
    <input id="cli-direccion" placeholder="Dirección + Localidad + Provincia" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px">
    <input id="cli-telefono" placeholder="Tel. de contacto" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px">
    <select id="cli-pago" style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px">
      <option value="">Forma de pago</option>
      <option>Transferencia / Efectivo</option>
      <option>Mercado Pago / Tarjeta</option>
      <option>12 cuotas sin interés</option>
      <option>Otro - Consultar</option>
    </select>
    <textarea id="cli-nota" placeholder="Nota: color, horario, etc." style="width:100%; padding:10px; margin-bottom:8px; border:1px solid #ddd; border-radius:8px; height:60px"></textarea>
  </div>
  <div class="carrito-footer">
    <div class="total">Total: $<span id="carrito-total">0</span></div>
    <a id="btn-finalizar-wsp" class="btn-primary" style="width:100%; display:block; text-align:center; margin-top:10px" target="_blank">Finalizar por WhatsApp</a>
  </div>
</div>

<footer class="footer">
  <p>Pri-Max Hogar © 2026</p>
  <a href="admin.html" class="admin-dot" title="Admin">·</a>
</footer>

<script src="js/app.js"></script>
</body>
</html>
