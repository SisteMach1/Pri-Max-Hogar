<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Pri-Max Hogar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{font-family:Inter; box-sizing:border-box} body{margin:0; background:#f5f5f5}
.login{max-width:400px; margin:100px auto; background:#fff; padding:30px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.1)}
input, select, textarea{width:100%; padding:12px; margin:6px 0 12px; border:1px solid #ddd; border-radius:8px}
button{padding:12px 18px; border:none; border-radius:8px; font-weight:700; cursor:pointer}
.btn-black{background:#111; color:#fff; width:100%}
.btn-green{background:#25D366; color:#fff}
.btn-red{background:#ff4444; color:#fff}
.admin-wrap{max-width:1100px; margin:20px auto; padding:20px}
.header-admin{display:flex; justify-content:space-between; align-items:center; background:#fff; padding:15px 20px; border-radius:12px; margin-bottom:20px}
.grid-admin{display:grid; grid-template-columns:350px 1fr; gap:20px}
.card{background:#fff; padding:18px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.05)}
.producto-admin{display:flex; gap:12px; padding:12px; background:#fff; border-radius:10px; margin-bottom:10px; align-items:center}
.producto-admin img{width:70px; height:70px; object-fit:cover; border-radius:8px}
.hidden{display:none}
</style>
</head>
<body>
<div id="login-screen" class="login">
  <h2>🔐 Admin Pri-Max Hogar</h2>
  <p style="font-size:13px; color:#666">Ingresá la clave para administrar productos</p>
  <input type="password" id="clave" placeholder="Clave de acceso">
  <button class="btn-black" onclick="login()">Entrar</button>
  <p id="error" style="color:red; font-size:13px"></p>
  <p style="font-size:11px; color:#999; margin-top:15px">Clave actual: todocaser.2020</p>
</div>

<div id="admin-screen" class="admin-wrap hidden">
  <div class="header-admin">
    <h2 style="margin:0">Panel Pri-Max Hogar</h2>
    <div><button onclick="cerrarSesion()" style="background:#eee">Salir</button> <a href="index.html" style="margin-left:10px; text-decoration:none; font-weight:700">Ver tienda →</a></div>
  </div>

  <div class="grid-admin">
    <div class="card">
      <h3>➕ Agregar / Editar producto</h3>
      <input type="hidden" id="edit-id">
      <label>Nombre</label>
      <input id="nombre" placeholder="Ej: Samsung A15 128GB">
      <label>Categoría</label>
      <select id="categoria">
        <option value="celulares">📱 Celulares</option>
        <option value="electro">⚡ Electrodomésticos</option>
        <option value="muebles">🛋️ Muebles</option>
        <option value="hogar">🏠 Hogar</option>
      </select>
      <label>Descripción / Medidas</label>
      <textarea id="medidas" placeholder="Ej: 6.5 pulgadas, 128GB, 50MP"></textarea>
      <label>Precio</label>
      <input type="number" id="precio" placeholder="Ej: 250000">
      <label>Stock</label>
      <input type="number" id="stock" placeholder="Ej: 5">
      <label>Link de Mercado Pago (opcional)</label>
      <input id="mp_link" placeholder="https://link.mercadopago.com.ar/...">
      <label>Foto del producto</label>
      <input type="file" id="foto" accept="image/*">
      <img id="preview" style="width:100%; height:180px; object-fit:cover; border-radius:8px; display:none; margin-bottom:10px">
      <button class="btn-black" onclick="guardarProducto()">💾 Guardar Producto</button>
      <button onclick="limpiarForm()" style="width:100%; margin-top:8px; background:#eee">Cancelar</button>
      <hr style="margin:20px 0">
      <h4>📦 Datos</h4>
      <button class="btn-green" onclick="exportar()" style="width:100%">⬇️ Exportar copia de seguridad</button>
      <input type="file" id="importarFile" accept=".json" style="margin-top:10px">
      <button onclick="importar()" style="width:100%; margin-top:6px; background:#eee">⬆️ Importar copia</button>
      <p style="font-size:11px; color:#888">Tus productos se guardan en este navegador. Exportá para tener copia.</p>
    </div>

    <div>
      <div class="card" style="margin-bottom:15px">
        <b>Total productos: <span id="total-prod">0</span></b> | WhatsApp configurado: <b>5493734525075</b>
      </div>
      <div id="lista-productos"></div>
    </div>
  </div>
</div>

<script>
const CLAVE_CORRECTA = "todocaser.2020";
const WHATSAPP = "5493734525075";
const LS_KEY = "primax_productos_v2";

const productosDefault = [
  {id:1, nombre:"Samsung Galaxy A54 128GB Liberado", categoria:"celulares", medidas:"6.4'' AMOLED - 8GB RAM - 50MP - 5000mAh", precio:345000, stock:8, img:"https://images.unsplash.com/photo-1598327105666-5b89351aff97?q=80&w=600", mp_link:""},
  {id:2, nombre:"Horno Eléctrico 45L Grill", categoria:"electro", medidas:"2000W - Convección - Timer", precio:89000, stock:15, img:"https://images.unsplash.com/photo-1584269600464-37b1b58a9fe7?q=80&w=600", mp_link:""},
  {id:3, nombre:"Rack TV 180cm Roble", categoria:"muebles", medidas:"180x45x60 - Melamina 18mm", precio:159000, stock:4, img:"https://images.unsplash.com/photo-1532372320572-cda25653a694?q=80&w=600", mp_link:""},
];

function getProductos(){
  const saved = localStorage.getItem(LS_KEY);
  return saved ? JSON.parse(saved) : productosDefault;
}
function saveProductos(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }

function login(){
  const clave = document.getElementById('clave').value;
  if(clave === CLAVE_CORRECTA){
    sessionStorage.setItem('admin_logueado','si');
    mostrarAdmin();
  } else {
    document.getElementById('error').innerText = "Clave incorrecta";
  }
}
function mostrarAdmin(){
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('admin-screen').classList.remove('hidden');
  renderAdmin();
}
function cerrarSesion(){ sessionStorage.removeItem('admin_logueado'); location.reload(); }

let imgBase64 = "";
document.getElementById('foto').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    imgBase64 = ev.target.result;
    document.getElementById('preview').src = imgBase64;
    document.getElementById('preview').style.display='block';
  };
  reader.readAsDataURL(file);
});

function guardarProducto(){
  const id = document.getElementById('edit-id').value;
  const nombre = document.getElementById('nombre').value.trim();
  const categoria = document.getElementById('categoria').value;
  const medidas = document.getElementById('medidas').value.trim();
  const precio = parseInt(document.getElementById('precio').value);
  const stock = parseInt(document.getElementById('stock').value);
  const mp_link = document.getElementById('mp_link').value.trim();
  if(!nombre || !precio){ alert('Nombre y precio obligatorios'); return; }
  let productos = getProductos();
  if(id){
    const idx = productos.findIndex(p=>p.id==id);
    productos[idx] = {...productos[idx], nombre, categoria, medidas, precio, stock, mp_link, img: imgBase64 || productos[idx].img };
  } else {
    const nuevo = { id: Date.now(), nombre, categoria, medidas, precio, stock, mp_link, img: imgBase64 || "https://via.placeholder.com/600x400?text=Sin+foto" };
    productos.push(nuevo);
  }
  saveProductos(productos);
  limpiarForm();
  renderAdmin();
}

function renderAdmin(){
  const productos = getProductos();
  document.getElementById('total-prod').innerText = productos.length;
  document.getElementById('lista-productos').innerHTML = productos.map(p=>`
    <div class="producto-admin">
      <img src="${p.img}">
      <div style="flex:1">
        <b>${p.nombre}</b><br>
        <small>${p.categoria} | $${p.precio.toLocaleString('es-AR')} | Stock: ${p.stock}</small><br>
        <small style="color:#777">${p.medidas}</small>
      </div>
      <div>
        <button onclick="editar(${p.id})" style="background:#111; color:#fff">Editar</button>
        <button class="btn-red" onclick="borrar(${p.id})">X</button>
      </div>
    </div>
  `).join('');
}

function editar(id){
  const p = getProductos().find(x=>x.id==id);
  document.getElementById('edit-id').value = p.id;
  document.getElementById('nombre').value = p.nombre;
  document.getElementById('categoria').value = p.categoria;
  document.getElementById('medidas').value = p.medidas;
  document.getElementById('precio').value = p.precio;
  document.getElementById('stock').value = p.stock;
  document.getElementById('mp_link').value = p.mp_link;
  imgBase64 = p.img;
  document.getElementById('preview').src = p.img;
  document.getElementById('preview').style.display='block';
  window.scrollTo(0,0);
}

function borrar(id){
  if(!confirm('¿Borrar este producto?')) return;
  let productos = getProductos().filter(p=>p.id!=id);
  saveProductos(productos);
  renderAdmin();
}

function limpiarForm(){
  document.getElementById('edit-id').value='';
  document.getElementById('nombre').value='';
  document.getElementById('medidas').value='';
  document.getElementById('precio').value='';
  document.getElementById('stock').value='';
  document.getElementById('mp_link').value='';
  document.getElementById('foto').value='';
  imgBase64='';
  document.getElementById('preview').style.display='none';
}

function exportar(){
  const data = localStorage.getItem(LS_KEY);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'primax-productos-backup.json';
  a.click();
}

function importar(){
  const file = document.getElementById('importarFile').files[0];
  if(!file) return alert('Elegí un archivo .json');
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const json = JSON.parse(e.target.result);
      saveProductos(json);
      renderAdmin();
      alert('Productos importados!');
    }catch{ alert('Archivo inválido'); }
  };
  reader.readAsText(file);
}

if(sessionStorage.getItem('admin_logueado')==='si'){ mostrarAdmin(); }
</script>
</body>
</html>
