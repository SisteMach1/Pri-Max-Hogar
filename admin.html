<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Pri-Max Hogar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#f5f5f5;padding:20px}
h1{font-size:20px;margin-bottom:15px}
.panel{display:grid;grid-template-columns:340px 1fr;gap:20px;max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
label{font-size:11px;font-weight:800;display:block;margin-top:10px;margin-bottom:4px}
input,select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:13px}
button{border:none;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}
.btn-save{background:#111;color:#fff;width:100%;margin-top:12px;padding:12px}
.grid-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.item{border:1px solid #eee;border-radius:10px;overflow:hidden;background:#fff}
.item img{width:100%;height:140px;object-fit:cover}
.item-body{padding:10px}
@media(max-width:800px){.panel{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>⚙️ ADMIN PRI-MAX HOGAR <a href="index.html" style="font-size:12px;margin-left:12px">← Volver a tienda</a></h1>
<div class="panel">
<div class="card">
<h3 id="form-title">Agregar producto</h3>
<input type="hidden" id="edit-id">
<label>Nombre</label><input id="nombre">
<label>Categoria</label><select id="categoria"><option value="electro">electro</option><option value="muebles">muebles</option><option value="bazar">bazar</option><option value="tecnologia">tecnologia</option></select>
<label>Medidas / Detalle</label><input id="medidas" placeholder="Ej: 1500W - Sin aceite">
<label>Precio</label><input id="precio" type="number">
<label>Stock</label><input id="stock" type="number" value="10">
<label>Link MercadoPago (opcional)</label><input id="mp_link" placeholder="https://mpago.la/...">
<label>Fotos del producto (podés elegir varias)</label>
<input type="file" id="foto" accept="image/*" multiple>
<div id="preview-container" style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px"></div>
<button class="btn-save" onclick="guardarProducto()">GUARDAR PRODUCTO</button>
<button onclick="limpiarForm()" style="width:100%;margin-top:8px;background:#eee">LIMPIAR</button>
<div style="margin-top:15px;padding:10px;background:#fff3cd;border-radius:8px;font-size:11px">Clave admin: todocaser.2020<br>Atajo PC: Shift+Ctrl+A<br>Celular: 5s en esquina inferior izquierda</div>
</div>
<div class="card">
<h3>Productos (<span id="count">0</span>)</h3>
<div id="lista-admin" class="grid-admin" style="margin-top:12px"></div>
</div>
</div>
<script>
let imgArray=[];
document.getElementById('foto').addEventListener('change',function(e){
 const files=Array.from(e.target.files);
 imgArray=[];
 const cont=document.getElementById('preview-container');
 cont.innerHTML='';
 files.forEach(f=>{
  const r=new FileReader();
  r.onload=ev=>{
   imgArray.push(ev.target.result);
   const im=document.createElement('img');
   im.src=ev.target.result;
   im.style='width:100%;height:70px;object-fit:cover;border-radius:6px';
   cont.appendChild(im);
  };
  r.readAsDataURL(f);
 });
});

function getProductos(){let p=localStorage.getItem('primax_productos');if(p){try{return JSON.parse(p)}catch{}}return [];}
function saveProductos(p){localStorage.setItem('primax_productos',JSON.stringify(p));}
function limpiarForm(){document.getElementById('edit-id').value='';document.getElementById('nombre').value='';document.getElementById('medidas').value='';document.getElementById('precio').value='';document.getElementById('stock').value='10';document.getElementById('mp_link').value='';document.getElementById('foto').value='';imgArray=[];document.getElementById('preview-container').innerHTML='';document.getElementById('form-title').innerText='Agregar producto';}
function guardarProducto(){
 const id=document.getElementById('edit-id').value;
 const nombre=document.getElementById('nombre').value.trim();
 const categoria=document.getElementById('categoria').value;
 const medidas=document.getElementById('medidas').value.trim();
 const precio=parseInt(document.getElementById('precio').value);
 const stock=parseInt(document.getElementById('stock').value)||0;
 const mp_link=document.getElementById('mp_link').value.trim();
 if(!nombre||!precio){alert('Nombre y precio obligatorios');return;}
 let productos=getProductos();
 let imgs=imgArray.length>0?imgArray:[];
 if(id){
  const idx=productos.findIndex(p=>p.id==id);
  const existente=productos[idx].imagenes||[productos[idx].img];
  const finalImgs=imgs.length>0?imgs:existente;
  productos[idx]={...productos[idx],nombre,categoria,medidas,precio,stock,mp_link,img:finalImgs[0],imagenes:finalImgs};
 }else{
  const finalImgs=imgs.length>0?imgs:["https://via.placeholder.com/400x300?text=Sin+foto"];
  productos.push({id:Date.now(),nombre,categoria,medidas,precio,stock,mp_link,img:finalImgs[0],imagenes:finalImgs});
 }
 saveProductos(productos);limpiarForm();renderAdmin();
}
function renderAdmin(){
 const productos=getProductos();
 document.getElementById('count').innerText=productos.length;
 document.getElementById('lista-admin').innerHTML=productos.map(p=>`<div class=item><img src="${p.img}"><div class=item-body><div style="font-weight:800;font-size:12px">${p.nombre}</div><div style="font-size:11px;color:#666">${p.categoria} - $${p.precio}</div><div style="font-size:10px">${p.imagenes?p.imagenes.length:1} fotos</div><div style="display:flex;gap:6px;margin-top:8px"><button onclick="editar(${p.id})" style="flex:1;background:#111;color:#fff;font-size:11px">Editar</button><button onclick="borrar(${p.id})" style="flex:1;background:#ffe0e0;color:#c00;font-size:11px">Borrar</button></div></div></div>`).join('');
}
function editar(id){const p=getProductos().find(x=>x.id==id);document.getElementById('edit-id').value=p.id;document.getElementById('nombre').value=p.nombre;document.getElementById('categoria').value=p.categoria;document.getElementById('medidas').value=p.medidas;document.getElementById('precio').value=p.precio;document.getElementById('stock').value=p.stock;document.getElementById('mp_link').value=p.mp_link||'';const imgs=p.imagenes||[p.img];imgArray=imgs;const cont=document.getElementById('preview-container');cont.innerHTML='';imgs.forEach(src=>{const im=document.createElement('img');im.src=src;im.style='width:100%;height:70px;object-fit:cover;border-radius:6px';cont.appendChild(im);});document.getElementById('form-title').innerText='Editando: '+p.nombre;window.scrollTo(0,0);}
function borrar(id){if(!confirm('Borrar?')) return;let productos=getProductos().filter(p=>p.id!=id);saveProductos(productos);renderAdmin();}
// Clave simple
if(prompt('Clave admin:')!=='todocaser.2020'){alert('Clave incorrecta');location.href='index.html';}
renderAdmin();
</script>
</body>
</html>
